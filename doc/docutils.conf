# docutils settings for the Sphinx documentation build.  Sphinx reads this
# file from its configuration directory, so CMake copies it there.

# let web browsers load images only when they are scrolled close to the
# visible part of a page.  the HTML writer of Sphinx is derived from the
# docutils "html4css1" writer, so a "html5 writer" section would be ignored.
[html writers]
image_loading: lazy
